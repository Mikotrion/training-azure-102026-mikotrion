name: Trigger auto deployment for gateway-api-git-ms

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - 'nodejs-microservices/packages/gateway-api/**'
    - '.github/workflows/gateway-api-git-ms-AutoDeployTrigger-1bb6734b-edf1-4e27-80fb-d59295181a9a.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.GATEWAYAPIGITMS_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.GATEWAYAPIGITMS_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.GATEWAYAPIGITMS_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/nodejs-microservices
          dockerfilePath: packages/gateway-api/Dockerfile
          registryURL: rejestrkontenerow.azurecr.io 
          registryUsername: ${{ secrets.GATEWAYAPIGITMS_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.GATEWAYAPIGITMS_REGISTRY_PASSWORD }}
          containerAppName: gateway-api-git-ms
          resourceGroup: aws-szkolenie-MS
          imageToBuild: rejestrkontenerow.azurecr.io/gateway-api-git-ms:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_
          environmentVariables: >
            SETTINGS_API_URL=https://gateway-api-git-ms.happyriver-c3b70016.westus2.azurecontainerapps.io
            DICE_API_URL=https://dice-api-git-ms.happyriver-c3b70016.westus2.azurecontainerapps.io


